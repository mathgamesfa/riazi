<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی عددنویسی میلیارد با خانم هدی</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Vazirmatn,Tahoma;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#dff6ff,#fff0fa);
transition:.5s;
overflow:hidden;
}

.box{
width:95%;
max-width:600px;
background:white;
border-radius:35px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px #aaa;
}

h1{
color:#d63384;
font-size:30px;
}

.teacher{
font-size:75px;
}

.pencil{
font-size:65px;
animation:jump 2s infinite;
}

@keyframes jump{
50%{
transform:translateY(-15px)
}
}

.question{
background:#9b5de5;
color:white;
font-size:28px;
padding:25px;
border-radius:25px;
margin:20px;
line-height:2;
}

input{
width:85%;
padding:15px;
font-size:24px;
text-align:center;
border-radius:20px;
border:4px solid #ddd;
transition:.4s;
}

.correct{
background:#c8f7c5;
border-color:#27ae60;
}

.wrong{
background:#ffcdd2;
border-color:#e74c3c;
}

button{
background:#00bbf9;
color:white;
border:none;
padding:15px 25px;
border-radius:25px;
font-size:22px;
margin:10px;
cursor:pointer;
}

.message{
font-size:24px;
font-weight:bold;
margin:20px;
}

.score{
font-size:22px;
color:#ff9800;
}

.star{
position:absolute;
font-size:40px;
animation:fall 2s linear forwards;
}

@keyframes fall{

from{
top:-50px;
opacity:1;
}

to{
top:90vh;
opacity:0;
}

}

</style>

</head>


<body>


<div class="box">

<h1>🌸 بازی عددنویسی میلیارد با خانم هدی 🌸</h1>


<div class="teacher">
👩‍🏫
</div>


<div class="pencil">
✏️
</div>


<div class="question" id="question">
؟
</div>


<input id="answer" type="text" placeholder="جواب را بنویس">


<br>


<button onclick="checkAnswer()">
بررسی جواب
</button>


<button onclick="newQuestion()">
سؤال جدید
</button>


<div class="message" id="message">
✏️ مداد کوچولو منتظر جواب توست
</div>


<div class="score">
⭐ امتیاز:
<span id="score">0</span>
</div>


</div>



<script>


let correctAnswer="";
let score=0;



function threeDigitsToWord(num){

let ones=[
"",
"یک","دو","سه","چهار","پنج",
"شش","هفت","هشت","نه"
];


let teens=[
"ده","یازده","دوازده","سیزده",
"چهارده","پانزده","شانزده",
"هفده","هجده","نوزده"
];


let tens=[
"","","بیست","سی","چهل",
"پنجاه","شصت","هفتاد",
"هشتاد","نود"
];


let hundreds=[
"",
"صد","دویست","سیصد",
"چهارصد","پانصد",
"ششصد","هفتصد",
"هشتصد","نهصد"
];


let result=[];


let h=Math.floor(num/100);

let t=Math.floor((num%100)/10);

let o=num%10;



if(h>0)
result.push(hundreds[h]);



if(t===1){

result.push(teens[o]);

}

else{

if(t>1)
result.push(tens[t]);


if(o>0)
result.push(ones[o]);

}


return result.join(" و ");

}





function numberToWord(num){


let billion=Math.floor(num/1000000000);


let million=Math.floor(
(num%1000000000)/1000000
);


let result=[];



if(billion>0){

result.push(
threeDigitsToWord(billion)+" میلیارد"
);

}



if(million>0){

result.push(
threeDigitsToWord(million)+" میلیون"
);

}



return result.join(" و ");

}


function toPersian(num){

return num.toString()
.replace(/0/g,"۰")
.replace(/1/g,"۱")
.replace(/2/g,"۲")
.replace(/3/g,"۳")
.replace(/4/g,"۴")
.replace(/5/g,"۵")
.replace(/6/g,"۶")
.replace(/7/g,"۷")
.replace(/8/g,"۸")
.replace(/9/g,"۹");

}




function newQuestion(){

let type=Math.floor(Math.random()*2);


let billion=Math.floor(Math.random()*9)+1;

let million=Math.floor(Math.random()*999);


let number=
billion*1000000000+
million*1000000;



let input=document.getElementById("answer");

input.value="";
input.className="";


if(type===0){


document.getElementById("question").innerHTML=
"عدد زیر را به حروف بنویس:<br><b>"+
toPersian(number.toLocaleString("fa-IR"))+
"</b>";


correctAnswer=
numberToWord(number);



}

else{


document.getElementById("question").innerHTML=
"عدد زیر را با رقم بنویس:<br><b>"+
numberToWord(number)+
"</b>";


correctAnswer=
number.toString();



}



document.getElementById("message").innerHTML=
"✏️ جواب را پیدا کن";

}




function goodSound(){

let audio=new AudioContext();


for(let i=0;i<5;i++){


let osc=audio.createOscillator();

let gain=audio.createGain();


osc.connect(gain);

gain.connect(audio.destination);


osc.type="square";


osc.frequency.value=350+i*80;


gain.gain.value=0.08;


let t=audio.currentTime+i*0.12;


osc.start(t);

osc.stop(t+0.07);


}

}




function wrongSound(){


let audio=new AudioContext();


let osc=audio.createOscillator();


let gain=audio.createGain();



osc.connect(gain);

gain.connect(audio.destination);



osc.type="sawtooth";


osc.frequency.value=180;


gain.gain.value=0.15;



osc.start();


osc.stop(audio.currentTime+0.35);



}




function stars(){


for(let i=0;i<20;i++){


let star=document.createElement("div");


star.className="star";


star.innerHTML="⭐";


star.style.left=Math.random()*100+"%";

document.body.appendChild(star);



setTimeout(()=>{

star.remove();

},2000);


}


}




function checkAnswer(){


let input=document.getElementById("answer");


let user=input.value.trim();


user=user
.replace(/۰/g,"0")
.replace(/۱/g,"1")
.replace(/۲/g,"2")
.replace(/۳/g,"3")
.replace(/۴/g,"4")
.replace(/۵/g,"5")
.replace(/۶/g,"6")
.replace(/۷/g,"7")
.replace(/۸/g,"8")
.replace(/۹/g,"9");



if(user===correctAnswer){


score++;


document.getElementById("score").innerHTML=score;


input.className="correct";


document.body.style.background=
"linear-gradient(#b9f6ca,#e8f5e9)";



document.getElementById("message").innerHTML=
"🎉 آفرین! درست جواب دادی 👏<br>مداد کوچولو خوشحال شد ✏️";



goodSound();

stars();



}

else{


input.className="wrong";


document.body.style.background=
"linear-gradient(#ffcdd2,#ffebee)";



document.getElementById("message").innerHTML=
"❌ اشتباه شد، دوباره فکر کن ✏️";



wrongSound();



}


}



newQuestion();



</script>


</body>

</html>
