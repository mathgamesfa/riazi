<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی الگوها با خانم هدی</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');


*{
box-sizing:border-box;
font-family:Vazirmatn,Tahoma;
}


body{

margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(#dff6ff,#fff0fa);

transition:.5s;

overflow:hidden;

}



.box{

width:95%;
max-width:600px;

background:white;

border-radius:35px;

padding:25px;

text-align:center;

box-shadow:0 10px 30px #aaa;

}



h1{

color:#d63384;

font-size:30px;

}



.teacher{

font-size:75px;

}



.pencil{

font-size:65px;

animation:jump 2s infinite;

}



@keyframes jump{

50%{

transform:translateY(-15px);

}

}



.question{

background:#9b5de5;

color:white;

font-size:32px;

padding:25px;

border-radius:25px;

margin:20px;

line-height:2;

}



input{

width:85%;

padding:15px;

font-size:28px;

text-align:center;

border-radius:20px;

border:4px solid #ddd;

}



.correct{

background:#c8f7c5;

border-color:#27ae60;

}



.wrong{

background:#ffcdd2;

border-color:#e74c3c;

}



button{

background:#00bbf9;

color:white;

border:none;

padding:15px 25px;

border-radius:25px;

font-size:22px;

margin:10px;

cursor:pointer;

}



.message{

font-size:24px;

font-weight:bold;

margin:20px;

}



.score{

font-size:22px;

color:#ff9800;

}



.star{

position:absolute;

font-size:40px;

animation:fall 2s linear forwards;

}



@keyframes fall{

from{

top:-50px;

opacity:1;

}


to{

top:90vh;

opacity:0;

}

}


</style>


</head>


<body>



<div class="box">


<h1>🌸 بازی الگوها با خانم هدی 🌸</h1>


<div class="teacher">

👩‍🏫

</div>


<div class="pencil">

✏️

</div>


<div class="question" id="question">

؟

</div>



<input id="answer" type="number" placeholder="عدد بعدی را بنویس">


<br>


<button onclick="checkAnswer()">

بررسی جواب

</button>


<button onclick="newQuestion()">

الگوی جدید

</button>



<div class="message" id="message">

✏️ الگو را پیدا کن

</div>


<div class="score">

⭐ امتیاز:

<span id="score">0</span>

</div>



</div>



<script>


let correctAnswer=0;

let score=0;



let patterns=[


{

arr:[5,9,15,23,33],

ans:45

},


{

arr:[200,180,155,125],

ans:90

},


{

arr:[3,6,12,24],

ans:48

},


{

arr:[2,5,11,23],

ans:47

},


{

arr:[1,4,9,16],

ans:25

},


{

arr:[120,150,190,240],

ans:300

},


{

arr:[7,14,28,56],

ans:112

},


{

arr:[100,90,75,55],

ans:30

},


{

arr:[4,9,16,25],

ans:36

},


{

arr:[10,20,40,80],

ans:160

}


];


function newQuestion(){


let random=Math.floor(Math.random()*patterns.length);


let p=patterns[random];


correctAnswer=p.ans;



document.getElementById("question").innerHTML=

"عدد بعدی الگو را پیدا کن:<br><b>"+

p.arr.join(" ، ")

+

" ، ؟</b>";



let input=document.getElementById("answer");

input.value="";

input.className="";



document.getElementById("message").innerHTML=

"✏️ با دقت به الگو نگاه کن";

}





// صدای تشویق

function goodSound(){

let audio=new AudioContext();


for(let i=0;i<5;i++){


let osc=audio.createOscillator();

let gain=audio.createGain();


osc.connect(gain);

gain.connect(audio.destination);



osc.type="square";


osc.frequency.value=350+i*80;


gain.gain.value=0.08;


let t=audio.currentTime+i*0.12;


osc.start(t);

osc.stop(t+0.07);


}

}




// صدای اشتباه

function wrongSound(){


let audio=new AudioContext();


let osc=audio.createOscillator();


let gain=audio.createGain();



osc.connect(gain);

gain.connect(audio.destination);



osc.type="sawtooth";


osc.frequency.value=180;


gain.gain.value=0.15;



osc.start();


osc.stop(audio.currentTime+0.35);



}





// افکت ستاره

function stars(){


for(let i=0;i<20;i++){


let star=document.createElement("div");


star.className="star";


star.innerHTML="⭐";


star.style.left=Math.random()*100+"%";



document.body.appendChild(star);



setTimeout(()=>{

star.remove();

},2000);



}


}







function checkAnswer(){


let input=document.getElementById("answer");


let user=Number(input.value);



if(user===correctAnswer){



score++;


document.getElementById("score").innerHTML=score;



input.className="correct";



document.body.style.background=

"linear-gradient(#b9f6ca,#e8f5e9)";




document.getElementById("message").innerHTML=

"🎉 آفرین! الگو را درست پیدا کردی 👏<br>مداد کوچولو خوشحال شد ✏️";



goodSound();


stars();



}


else{



input.className="wrong";



document.body.style.background=

"linear-gradient(#ffcdd2,#ffebee)";




document.getElementById("message").innerHTML=

"❌ اشتباه شد، دوباره الگو را بررسی کن ✏️";



wrongSound();



}


}





newQuestion();



</script>


</body>

</html>
