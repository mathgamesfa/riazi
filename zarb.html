<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازی ضرب با خانم هدی</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Vazirmatn,Tahoma;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(#dff6ff,#fff0fa);
display:flex;
justify-content:center;
align-items:center;
transition:.5s;
}

.container{
width:95%;
max-width:600px;
background:white;
border-radius:35px;
padding:25px;
text-align:center;
box-shadow:0 10px 30px #bbb;
}


h1{
color:#d63384;
font-size:32px;
}


.teacher{
font-size:70px;
}

.pencil{
font-size:70px;
animation:jump 2s infinite;
}

@keyframes jump{
50%{transform:translateY(-15px)}
}


.question{
background:#9b5de5;
color:white;
padding:25px;
border-radius:25px;
font-size:35px;
margin:20px;
}


input{
width:80%;
padding:15px;
font-size:25px;
text-align:center;
border:3px solid #ddd;
border-radius:20px;
}


button{
margin:10px;
padding:15px 30px;
border:none;
border-radius:25px;
font-size:22px;
cursor:pointer;
background:#00bbf9;
color:white;
}


button:hover{
transform:scale(1.05);
}


.message{
font-size:25px;
margin:20px;
font-weight:bold;
}


.score{
font-size:22px;
color:#ff9800;
}


</style>

</head>


<body>

<div class="container">


<h1>
🌸 بازی ضرب با خانم هدی 🌸
</h1>


<div class="teacher">
👩‍🏫
</div>


<div class="pencil">
✏️
</div>


<div class="question" id="question">
؟
</div>


<input id="answer" type="number" placeholder="جواب را بنویس">


<br>


<button onclick="checkAnswer()">
بررسی جواب
</button>


<button onclick="newQuestion()">
سؤال جدید
</button>


<div class="message" id="message">
مداد کوچولو منتظر جواب توست ✏️
</div>


<div class="score">
⭐ امتیاز: <span id="score">0</span>
</div>


</div>



<script>

let num1;
let num2;
let score=0;


function newQuestion(){

num1=Math.floor(Math.random()*10)+1;
num2=Math.floor(Math.random()*10)+1;

document.getElementById("question").innerHTML=
num1+" × "+num2+" = ؟";


document.getElementById("answer").value="";
document.getElementById("message").innerHTML=
"✏️ مداد کوچولو منتظر جواب توست";


document.body.style.background=
"linear-gradient(#dff6ff,#fff0fa)";

}


function checkAnswer(){

let userAnswer=
Number(document.getElementById("answer").value);


let correct=num1*num2;


if(userAnswer===correct){

score++;

document.getElementById("score").innerHTML=score;


document.body.style.background=
"linear-gradient(#b9f6ca,#e8f5e9)";


document.getElementById("message").innerHTML=
"🎉 آفرین! پاسخ درست بود 🌟<br>مداد کوچولو به تو افتخار می‌کند ✏️";


}

else{


document.body.style.background=
"linear-gradient(#ffcdd2,#ffebee)";


document.getElementById("message").innerHTML=
"🌸 اشکالی ندارد! دوباره فکر کن.<br>جواب درست را پیدا می‌کنی 😊";


}


}


newQuestion();


</script>


</body>
</html>
